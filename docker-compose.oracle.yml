services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: pos-oracle-db
    restart: unless-stopped
    environment:
      ORACLE_PWD: ${ORACLE_SYS_PASSWORD:-ChangeThisOracleAdminPassword1}
      ORACLE_APP_PASSWORD: ${ORACLE_PASSWORD:-ChangeThisPosPassword1}
    ports:
      - "1521:1521"
    volumes:
      - pos-oracle-data:/opt/oracle/oradata
      - ./docker/oracle/setup:/opt/oracle/scripts/setup:ro

volumes:
  pos-oracle-data:
